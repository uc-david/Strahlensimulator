; Strahlensimulator fuer das Dosisleistungsmessgeraet 6150AD2
; Zielhardware: ATmega32U4 (Arduino Leonardo oder Micro)
;
; Bauen:          pio run
; Hochladen:      pio run -e leonardo -t upload
; Serieller Mon.: pio device monitor

[platformio]
default_envs = leonardo

[env]
platform = atmelavr
framework = arduino
monitor_speed = 115200

[env:leonardo]
board = leonardo

[env:micro]
board = micro

; Wie leonardo, zusaetzlich Ausgabe von Null-/Endwert, Mittelwert
; und Pulsrate alle 500 ms ueber den seriellen Monitor
[env:leonardo_debug]
board = leonardo
build_flags = -D DEBUG
